<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lembrete de Medicamentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Lembrete de Medicamentos</span>
      <span class="navbar-text small">Painel do cuidador</span>
    </div>
  </nav>

  <main class="container pb-5">
    <div id="alerta" class="alert d-none" role="alert"></div>

    <div class="row g-4">
      <aside class="col-md-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h5 mb-0">Pacientes</h2>
          <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#modalPaciente">+ Novo</button>
        </div>
        <div id="listaPacientes" class="list-group"></div>
      </aside>

      <section class="col-md-8" id="detalhe"></section>
    </div>
  </main>

  <!-- Modal: novo paciente -->
  <div class="modal fade" id="modalPaciente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="formPaciente">
        <div class="modal-header">
          <h5 class="modal-title">Novo paciente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="erro-form alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label">Nome do paciente</label>
            <input name="nome" class="form-control" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Telefone do paciente (quem vai atender a ligação)</label>
            <input name="telefone" class="form-control" placeholder="(31) 98888-7777" required>
          </div>
          <hr>
          <div class="mb-3">
            <label class="form-label">Nome do cuidador</label>
            <input name="cuidador_nome" class="form-control" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Telefone do cuidador (recebe o alerta)</label>
            <input name="cuidador_telefone" class="form-control" placeholder="(31) 97777-6666" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: novo medicamento -->
  <div class="modal fade" id="modalMedicamento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="formMedicamento">
        <div class="modal-header">
          <h5 class="modal-title">Novo medicamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="erro-form alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label">Nome do medicamento</label>
            <input name="nome" class="form-control" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Como o paciente reconhece o remédio</label>
            <input name="descricao" class="form-control" maxlength="200"
                   placeholder="o comprimido redondo e rosa" required>
            <div class="form-text">Isso será falado na ligação: "Pegue <em>o comprimido redondo e rosa</em>".</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Horários (opcional)</label>
            <input name="horarios" class="form-control" placeholder="08:00, 20:00">
            <div class="form-text">Separe por vírgula. Você pode adicionar mais depois.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
